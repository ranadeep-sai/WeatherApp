<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Weather Pro</title>
    <link rel="icon" href="myicon.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
transition:.3s;
}
body.dark{
background:#111;
color:#fff;
}
.container{
width:100%;
max-width:450px;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}
body.dark .container{
background:#222;
color:white;
}
h1{text-align:center;margin-bottom:20px}
.search{
display:flex;
gap:10px;
margin-bottom:15px;
}
input{
flex:1;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
}
button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
}
.weather{
text-align:center;
margin-top:15px;
}
.weather img{
width:100px;
}
.temp{
font-size:40px;
font-weight:bold;
}
.details{
display:flex;
justify-content:space-between;
margin-top:20px;
}
.card{
width:48%;
padding:12px;
background:#f4f4f4;
border-radius:12px;
}
body.dark .card{
background:#333;
}
.forecast-container{
margin-top:20px;
display:none;
}
.forecast-grid{
display:flex;
gap:10px;
overflow-x:auto;
margin-top:10px;
padding-bottom:5px;
}
.forecast-card{
min-width:75px;
padding:10px;
background:#f4f4f4;
border-radius:10px;
text-align:center;
flex:1;
}
body.dark .forecast-card{
background:#333;
}
.forecast-card img{
width:40px;
}
.history{
margin-top:20px;
}
.history button{
margin:3px;
padding:6px 10px;
}
.top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}
</style>
</head>
<body>

<div class="container">

<div class="top">
<h3>Weather Pro</h3>
<button onclick="toggleTheme()">🌙</button>
</div>

<div class="search">
<input type="text" id="city" placeholder="Enter city">
<button onclick="getWeather()">Search</button>
</div>

<button style="width:100%" onclick="getLocationWeather()">
📍 Use Current Location
</button>

<div class="weather" id="weather">
<h2 id="cityName"></h2>
<img id="icon">
<div class="temp" id="temp"></div>
<p id="condition"></p>

<div class="details">
<div class="card">
<h4>Humidity</h4>
<p id="humidity"></p>
</div>

<div class="card">
<h4>Wind</h4>
<p id="wind"></p>
</div>
</div>
</div>

<div class="forecast-container" id="forecastContainer">
<h3>5-Day Forecast</h3>
<div class="forecast-grid" id="forecast"></div>
</div>

<div class="history">
<h3>Recent Searches</h3>
<div id="history"></div>
</div>

</div>

<script>
const API_KEY="34da70ae97b2bcb3f42391b2fc9ed1c7";

async function getWeather(cityInput=null){
const city=cityInput || document.getElementById("city").value;
if(!city) return;

try{
const res=await fetch(
`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
);
const data=await res.json();
if (data.cod != 200) {
    alert(data.message);
    return;
}
updateUI(data);
saveHistory(city);
getForecastByCity(city);
}catch(err){
alert("City not found");
}
}

async function getLocationWeather(){
navigator.geolocation.getCurrentPosition(async(pos)=>{
const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

const res=await fetch(
`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
);
const data=await res.json();
if (data.cod != 200) {
    alert(data.message);
    return;
}
updateUI(data);
getForecastByCoords(lat, lon);
});
}

async function getForecastByCity(city){
try{
const res=await fetch(
`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric`
);
const data=await res.json();
if(data.cod==="200"){
updateForecastUI(data);
}
}catch(err){
console.error(err);
}
}

async function getForecastByCoords(lat, lon){
try{
const res=await fetch(
`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
);
const data=await res.json();
if(data.cod==="200"){
updateForecastUI(data);
}
}catch(err){
console.error(err);
}
}

function updateUI(data){
document.getElementById("cityName").innerText=
`${data.name}, ${data.sys.country}`;

document.getElementById("temp").innerText=
`${Math.round(data.main.temp)}°C`;

document.getElementById("condition").innerText=
data.weather[0].description;

document.getElementById("humidity").innerText=
data.main.humidity+"%";

document.getElementById("wind").innerText=
data.wind.speed+" km/h";

const icon=data.weather[0].icon;
document.getElementById("icon").src=
`https://openweathermap.org/img/wn/${icon}@2x.png`;
}

function updateForecastUI(data){
const forecastEl=document.getElementById("forecast");
document.getElementById("forecastContainer").style.display="block";

// Filter list to grab one forecast entry per day (around midday 12:00 PM)
const dailyData=data.list.filter(item=>item.dt_txt.includes("12:00:00"));

let html="";
dailyData.forEach(day=>{
const date=new Date(day.dt*1000);
const dayName=date.toLocaleDateString('en-US',{weekday:'short'});
const icon=day.weather[0].icon;
const temp=Math.round(day.main.temp);

html+=`
<div class="forecast-card">
<p style="font-weight:bold;font-size:13px;">${dayName}</p>
<img src="https://openweathermap.org/img/wn/${icon}@2x.png">
<p style="font-size:13px;">${temp}°C</p>
</div>
`;
});
forecastEl.innerHTML=html;
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

function saveHistory(city){
let history=
JSON.parse(localStorage.getItem("weatherHistory")) || [];

if(!history.includes(city))
history.unshift(city);

history=history.slice(0,5);

localStorage.setItem(
"weatherHistory",
JSON.stringify(history)
);
loadHistory();
}

function loadHistory(){
let history=
JSON.parse(localStorage.getItem("weatherHistory")) || [];
let html="";

history.forEach(city=>{
html+=`
<button onclick="getWeather('${city}')">
${city}
</button>
`;
});

document.getElementById("history").innerHTML=html;
}

loadHistory();
</script>

</body>
</html>
