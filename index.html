<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Weather Pro</title>
    <link rel="icon" href="mylogo.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
transition:.3s;
}
body.dark{
background:#111;
color:#fff;
}
.container{
width:100%;
max-width:450px;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}
body.dark .container{
background:#222;
color:white;
}
h1{text-align:center;margin-bottom:20px}
.search{
display:flex;
gap:10px;
margin-bottom:15px;
}
input{
flex:1;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
}
button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
}
.weather{
text-align:center;
margin-top:15px;
}
.weather img{
width:100px;
}
.temp{
font-size:40px;
font-weight:bold;
}
.details{
display:flex;
justify-content:space-between;
margin-top:20px;
}
.card{
width:48%;
padding:12px;
background:#f4f4f4;
border-radius:12px;
}
body.dark .card{
background:#333;
}
.history{
margin-top:20px;
}
.history button{
margin:3px;
padding:6px 10px;
}
.top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}
</style>
</head>
<body>

<div class="container">

<div class="top">
<h3>Weather Pro</h3>
<button onclick="toggleTheme()">🌙</button>
</div>

<div class="search">
<input type="text" id="city" placeholder="Enter city">
<button onclick="getWeather()">Search</button>
</div>

<button style="width:100%" onclick="getLocationWeather()">
📍 Use Current Location
</button>

<div class="weather" id="weather">
<h2 id="cityName"></h2>
<img id="icon">
<div class="temp" id="temp"></div>
<p id="condition"></p>

<div class="details">
<div class="card">
<h4>Humidity</h4>
<p id="humidity"></p>
</div>

<div class="card">
<h4>Wind</h4>
<p id="wind"></p>
</div>
</div>
</div>

<div class="history">
<h3>Recent Searches</h3>
<div id="history"></div>
</div>

</div>

<script>
const API_KEY="34da70ae97b2bcb3f42391b2fc9ed1c7";

async function getWeather(cityInput=null){

const city=cityInput || document.getElementById("city").value;

if(!city) return;

try{

const res=await fetch(
`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
);

const data=await res.json();
if (data.cod != 200) {
    alert(data.message);
    return;
}
updateUI(data);

saveHistory(city);

}catch(err){
alert("City not found");
}
}

async function getLocationWeather(){

navigator.geolocation.getCurrentPosition(async(pos)=>{

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

const res=await fetch(
`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
);

const data=await res.json();
if (data.cod != 200) {
    alert(data.message);
    return;
}
updateUI(data);

});
}

function updateUI(data){

document.getElementById("cityName").innerText=
`${data.name}, ${data.sys.country}`;

document.getElementById("temp").innerText=
`${Math.round(data.main.temp)}°C`;

document.getElementById("condition").innerText=
data.weather[0].description;

document.getElementById("humidity").innerText=
data.main.humidity+"%";

document.getElementById("wind").innerText=
data.wind.speed+" km/h";

const icon=data.weather[0].icon;

document.getElementById("icon").src=
`https://openweathermap.org/img/wn/${icon}@2x.png`;
}

function toggleTheme(){
document.body.classList.toggle("dark");
}

function saveHistory(city){

let history=
JSON.parse(localStorage.getItem("weatherHistory")) || [];

if(!history.includes(city))
history.unshift(city);

history=history.slice(0,5);

localStorage.setItem(
"weatherHistory",
JSON.stringify(history)
);

loadHistory();
}

function loadHistory(){

let history=
JSON.parse(localStorage.getItem("weatherHistory")) || [];

let html="";

history.forEach(city=>{
html+=`
<button onclick="getWeather('${city}')">
${city}
</button>
`;
});

document.getElementById("history").innerHTML=html;
}

loadHistory();

</script>

</body>
</html>
